[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-graph"
version = "0.1.0"
description = "Social media knowledge base — LinkedIn posts → Obsidian graph"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "Akash", email = "akash@example.com" }
]
keywords = ["obsidian", "knowledge-graph", "linkedin", "mcp", "llm", "pipeline", "agentic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",

    # Database
    "sqlalchemy>=2",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "sqlite-vec",

    # LLM
    "openai>=1.30",
    "httpx>=0.27",
    "tenacity>=8",

    # Browser automation
    "playwright>=1.44",
    "playwright-stealth",

    # Content extraction
    "trafilatura>=1.10",
    "beautifulsoup4>=4.12",
    "lxml>=5",

    # Graph + Obsidian
    "graphifyy[leiden]>=0.7.16",
    "networkx>=3.0",

    # CLI + logging
    "typer>=0.12",
    "structlog>=24",
    "jinja2>=3.1",

    # MCP (for optional Obsidian MCP integration in M2)
    "mcp>=1.0,<2.0",

    # Local embeddings
    "sentence-transformers",
    "pillow>=9.1.0",

    # Web UI & REST API (M7)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Scheduler (M6)
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
]
mcp-http = [
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.scripts]
sg = "socialgraph.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["socialgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "N", "C4", "PT", "ARG", "RUF"
]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
